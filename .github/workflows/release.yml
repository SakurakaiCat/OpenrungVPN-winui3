name: release

# Builds the portable dist (WinUI app + Go core sidecar) and publishes a
# pre-release zip. Runs on manual dispatch with a version input, or on a
# pushed v* tag (which names the release).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.1.0-alpha.3'
        required: true
        default: 'v0.1.0-alpha.3'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  core:
    name: Build openrung-core.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Build core (windows/amd64)
        working-directory: core
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
          go build -tags "with_utls with_external_windivert" \
            -trimpath -ldflags "-s -w" \
            -o ../openrung-core.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: openrung-core.exe
          if-no-files-found: error

  app:
    name: Build OpenRung.WinUI.exe (C++/WinRT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Puts MSBuild and the VC toolchain on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build app (Release, win-x64, self-contained)
        shell: cmd
        run: |
          msbuild app\OpenRung.WinUI.Cpp\OpenRung.WinUI.Cpp.vcxproj ^
            /restore /m /p:Configuration=Release /p:Platform=x64 ^
            /p:OutDir=${{ github.workspace }}\dist-app\ ^
            /p:IntDir=${{ github.workspace }}\obj\
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist-app
          if-no-files-found: error

  release:
    name: Assemble dist and publish pre-release
    needs: [core, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: dist/core

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist

      - name: Zip portable dist
        run: |
          chmod +x dist/core/openrung-core.exe
          # MSBuild may stage the app under dist/OpenRung.WinUI/ — flatten.
          if [ -d dist/OpenRung.WinUI ]; then
            mv dist/OpenRung.WinUI/* dist/
            rmdir dist/OpenRung.WinUI
          fi
          test -f dist/OpenRung.WinUI.exe
          cd dist && zip -qr ../OpenRung-win-x64.zip .

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ${{ inputs.version || github.ref_name }}
          prerelease: true
          files: OpenRung-win-x64.zip
