name: release

# Builds the portable dist (WinUI app + Go core sidecar), packages it as both
# a portable zip and an Inno Setup installer, and publishes the release.
# Runs on manual dispatch with a version input, or on a pushed v* tag (which
# names the release; dispatch builds land as pre-releases).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.1.0-alpha.3'
        required: true
        default: 'v0.1.0'
  push:
    tags: ['v*']

permissions:
  contents: write

# One release pipeline per ref at a time; superseded dispatch runs are
# cancelled, tag builds are never cancelled mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  core:
    name: Build openrung-core.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build core (windows/amd64)
        working-directory: core
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
          go build -tags "with_utls with_external_windivert" \
            -trimpath -ldflags "-s -w" \
            -o ../openrung-core.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: openrung-core.exe
          if-no-files-found: error

  app:
    name: Build OpenRung.WinUI.exe (C++/WinRT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The restore pulls the WindowsAppSDK / CppWinRT / WebView2 NuGet
      # packages every run; cache the global packages folder keyed on the
      # project file that pins their versions.
      - uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-win-x64-${{ hashFiles('app/OpenRung.WinUI.Cpp/OpenRung.WinUI.Cpp.vcxproj') }}
          restore-keys: nuget-win-x64-

      # Puts MSBuild and the VC toolchain on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build app (Release, win-x64, self-contained)
        shell: cmd
        run: |
          msbuild app\OpenRung.WinUI.Cpp\OpenRung.WinUI.Cpp.vcxproj ^
            /restore /m /p:Configuration=Release /p:Platform=x64 ^
            /p:OutDir=${{ github.workspace }}\dist-app\ ^
            /p:IntDir=${{ github.workspace }}\obj\
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist-app
          if-no-files-found: error

  package:
    name: Package portable zip + installer
    needs: [core, app]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: core
          path: dist/core

      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist

      # MSBuild may stage the app under dist/OpenRung.WinUI/ — flatten.
      - name: Flatten app output
        shell: bash
        run: |
          if [ -d dist/OpenRung.WinUI ]; then
            mv dist/OpenRung.WinUI/* dist/
            rmdir dist/OpenRung.WinUI
          fi
          test -f dist/OpenRung.WinUI.exe
          test -f dist/core/openrung-core.exe

      - name: Zip portable dist
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath OpenRung-win-x64.zip -CompressionLevel Optimal

      # The app links the dynamic CRT; bundle the VC++ redistributable for
      # the installer (aka.ms is Microsoft's stable permalink).
      - name: Fetch VC++ redistributable
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile vc_redist.x64.exe

      - name: Build installer (Inno Setup)
        shell: cmd
        run: |
          where iscc >nul 2>&1 || choco install innosetup -y --no-progress
          where iscc >nul 2>&1 || set "PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6"
          iscc /DAppVersion=${{ inputs.version || github.ref_name }} scripts\installer.iss
          if errorlevel 1 exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: OpenRung-win-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: scripts/installer-out/OpenRung-Setup-*-x64.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-zip
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ${{ inputs.version || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            OpenRung-win-x64.zip
            OpenRung-Setup-*-x64.exe
